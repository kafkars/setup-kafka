# Derived from the Apache Kafka environments qualified by kafkars/testlab.
services:
  broker:
    image: ${KAFKA_IMAGE:?set KAFKA_IMAGE to an exact digest}
    hostname: broker
    labels:
      dev.kafkars.setup-kafka.project: ${KAFKA_PROJECT:?set KAFKA_PROJECT}
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:?set KAFKA_HOST_PORT}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:${KAFKA_EXTERNAL_PROTOCOL:?set KAFKA_EXTERNAL_PROTOCOL}
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:${KAFKA_HOST_PORT},INTERNAL://broker:19092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093
      KAFKA_LISTENERS: CONTROLLER://:29093,EXTERNAL://:9092,INTERNAL://:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    stop_grace_period: 20s
